# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    arm_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    gripper_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# gz_ros2_control's GazeboSimSystem runs as its own node ("/gz_ros_control", not
# "/controller_manager") and reads this single global P gain as a plain ROS
# parameter on THIS node (not per-joint, and not from the URDF's <ros2_control>
# block despite that being the more obvious place to look).
#
# IMPORTANT: for a position command interface this gain does NOT produce an
# effort. gz_system.cpp computes  target_velocity = gain * position_error *
# update_rate  and sends that as a JointVelocityCmd. So the units are "velocity
# per unit error", and the real static hold against gravity is done by Gazebo's
# velocity motor resisting motion at zero commanded velocity (bounded by the
# joint effort limit), NOT by this gain. That means a modest gain holds fine;
# cranking it huge just commands absurd velocities and oscillates. It also means
# the joint's URDF <limit velocity="..."> MUST be > 0 -- with velocity=0 the
# velocity command is clamped to zero and the arm can never correct its sag.
gz_ros_control:
  ros__parameters:
    position_proportional_gain: 1.0

arm_group_controller:
  ros__parameters:
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_group_controller:
  ros__parameters:
    joints:
      - gripper_controller
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # NOTE: "effort" deliberately NOT listed here. joint_trajectory_controller
    # only supports position/velocity/acceleration as ITS OWN state_interfaces
    # -- adding "effort" failed its parameter validation on activation, which
    # silently killed the whole controller (spawner never got an action
    # server up: "gripper_group_controller action server not available").
    # joint_state_broadcaster publishes whatever state interfaces the
    # hardware exposes (declared in firefighter.ros2_control.xacro)
    # automatically, with no per-controller opt-in needed -- the "effort"
    # state_interface on the gripper_controller JOINT there is sufficient by
    # itself to get effort onto /joint_states.
